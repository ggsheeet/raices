root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  cmd = "go build -tags dev -o ./tmp/main ."
  delay = 1000
  exclude_dir = ["tmp", "vendor", "bin", "testdata", ".git", ".cursor", "database/sqlc"]
  exclude_file = []
  exclude_regex = ["_test.go", "_templ.go", "database/sqlc/"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "templ", "css", "js", "sql"]
  include_file = []
  kill_delay = "500ms"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = ["go tool templ generate", "go tool sqlc generate"]
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true
